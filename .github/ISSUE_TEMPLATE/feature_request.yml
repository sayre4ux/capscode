name: Feature request
description: Suggest a change or a new capability.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check the [roadmap](https://sayre4ux.github.io/capscode/roadmap.html) first; it also lists
        what is deliberately not planned.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like CapsCode to do.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Effect on isolation
      description: Would this change what the agent can reach (host files, credentials, network)? Say how, if you know.
