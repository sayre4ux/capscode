# Frozen copy of images/toolchain.lock.toml (sequence 1) for unit tests. Tests expect these exact
# values, so do not bump it with the shipped lock; tests about the shipped lock read that file.

# Pinned versions/digests for the gateway/capsule base images and every AI tool
# layered on top of them. The CLI reads this file to compute the image tag it
# expects for each tool, and scripts/build-images.sh reads it to build them.
#
# Normalize, don't randomize: the base images are pinned BY DIGEST
# (the strong reproducibility anchor) and each npm package by exact version +
# tarball integrity. apt package versions are NOT individually pinned here; they
# float with the bookworm index fetched by `apt-get update`.

schema = 1
# Release metadata (docs/channel-format.md). `sequence` advances once per
# published toolchain release; clients refuse a channel lock whose sequence is not
# greater than the one they run. `min_cli_version` is the oldest CLI allowed to
# use this lock. `yanked` lists withdrawn `tool@version` entries or digests.
sequence = 1
min_cli_version = "0.1.0"
yanked = []

[base]
# debian:bookworm-slim — capsule base + gateway base. Resolved via
# `docker buildx imagetools inspect debian:bookworm-slim` on 2026-07-18.
image  = "debian:bookworm-slim"
digest = "sha256:7b140f374b289a7c2befc338f42ebe6441b7ea838a042bbd5acbfca6ec875818"

# Node LTS runtime baked into the capsule base (multi-stage copy). Pinned by the
# node image digest; the shipped interpreter is v22.23.1.
node_image   = "node:22-bookworm-slim"
node_digest  = "sha256:6c74791e557ce11fc957704f6d4fe134a7bc8d6f5ca4403205b2966bd488f6b3"
node_version = "22.23.1"

# Bun runtime used only by the omp capsule layer (multi-stage copy). Not read by
# the CLI ToolchainLock deserializer today — pin lives here for build scripts /
# Dockerfile ARG alignment. Multi-arch index digest; shipped interpreter 1.3.14.
bun_image   = "oven/bun:1-debian"
bun_digest  = "sha256:9dba1a1b43ce28c9d7931bfc4eb00feb63b0114720a0277a8f939ae4dfc9db6f"
bun_version = "1.3.14"

[seeder]
# alpine:3 — one-shot ingress seeder (extraction tools only; NOT git). Resolved via
# `docker image inspect alpine:3` on 2026-07-25; alpine 3.24.1.
image  = "alpine:3"
digest = "sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b"

# Audited apt candidates in the pinned bookworm suite (2026-07-18), for
# traceability — not enforced pins:
#   gateway: wireguard-tools 1.0.20210914-1+b1, wireguard-go 0.0.20220316-1+b4,
#            nftables 1.0.6-2+deb12u2, iproute2 6.1.0-3, openresolv 3.12.0-3,
#            ca-certificates 20230311+deb12u1
#   capsule: git 1:2.39.5-0+deb12u3, rsync 3.2.7-1+deb12u6,
#            util-linux 2.38.1-5+deb12u3 (provides setpriv),
#            ca-certificates 20230311+deb12u1

[tools]
# npm packages installed in capsule layers. Each Dockerfile verifies the published
# tarball's sha512 integrity before installing it, then installs it with
# `npm install --before=<resolved_before>`: the tool's own dependencies resolve to
# the newest versions published before that time, so every build of a pin gets
# the dependency set that was tested with it. Update entries with
# scripts/bump-tool.sh, which applies a three-day release and dependency cooldown.
claude   = { package = "@anthropic-ai/claude-code", version = "2.1.285", integrity = "sha512-frr0DLmVHSDNjw+hC6ZmXMVQ8yH4nNmVcI4lVFzWt0bdPNZP7clOKsuLcqSdwQabIpe6A3NEc3TJfiBVD8B2Bg==", resolved_before = "2026-10-01T04:51:24Z", channel = "stable", smoke = "ci", smoke_date = "2026-10-18", smoke_arch = ["arm64"], home_exec_paths = [] }
codex    = { package = "@openai/codex",             version = "0.159.3", integrity = "sha512-hg4nlqCwRb87GocxNnHvz4sadOrdJ71mO0a4CUYWXjAozJe2gtuAdRFldKGSQXw9m7SgR4ydis12KDVVPgzDkQ==", resolved_before = "2026-10-01T04:51:25Z", channel = "latest", smoke = "ci", smoke_date = "2026-10-18", smoke_arch = ["arm64"], home_exec_paths = [], daemon_seed_layout = 1 }
opencode = { package = "opencode-ai",               version = "1.18.3", integrity = "sha512-HnItl/+uhSpj7JV9x6ITiE0XFq4b/PKF5OM03TIyiFoFiLw3MQoJOAXZFTEzC7IOgAIYcysRQBBmCmlXILkxww==", resolved_before = "2026-09-27T10:24:56Z", channel = "latest", smoke = "ci", smoke_date = "2026-10-18", smoke_arch = ["arm64"], home_exec_paths = [], needs_exec_tmpdir = true }

# Pi — "a minimal agent harness" (https://pi.dev). Scoped npm package (the bare
# `pi` name is an UNRELATED joke package). Installed with `--ignore-scripts`.
# Version/schema verified against its bundled models.json documentation and
# provider composer while fixing fail-closed broker routing.
pi       = { package = "@earendil-works/pi-coding-agent", version = "0.99.2", integrity = "sha512-6R1BZ2N77CrVcGf3eC2KovTz1Q4RYiAeydvVWQT546N2fi1nBc81aURlbOZCgruWoW9VY/UrLzDynF4YTolpoA==", resolved_before = "2026-10-01T04:51:25Z", channel = "latest", smoke = "ci", smoke_date = "2026-10-18", smoke_arch = ["arm64"], home_exec_paths = [], path_tools = ["rg", "fd"] }

# omp — coding agent at https://omp.sh (npm `@oh-my-pi/pi-coding-agent`, bin `omp`).
# Different lineage from `pi` above. Requires Bun (see bun_* in [base]); install
# with `--ignore-scripts`. Integrity verified via `npm view` 2026-07-30.
# omp records the two search tools installed by this design; additional utilities are not included.
omp      = { package = "@oh-my-pi/pi-coding-agent", version = "18.4.6", integrity = "sha512-9SViKqactmPvlWVzvAUu1m2VVR4qPQXyCPSQs45Hpg7aQuX/ur/sbKlPKxMUO3LNDKp7DAQIOy67lIuaShwqpw==", resolved_before = "2026-10-01T04:51:25Z", channel = "latest", smoke = "ci", smoke_date = "2026-10-18", smoke_arch = ["arm64"], home_exec_paths = [], path_tools = ["rg", "fd"] }
playwright_core = { package = "playwright-core", version = "1.56.0", integrity = "sha512-1SXl7pMfemAMSDn5rkPeZljxOCYAmQnYLBTExuh6E8USHXGSX3dx6lYZN/xPpTz1vimXmPA9CDnILvmJaB8aSQ==", resolved_before = "2026-09-27T10:24:56Z", channel = "latest", smoke = "ci", smoke_date = "2026-10-18", smoke_arch = ["arm64"] }

# Kimi needs NO separate tool entry/image: it is `claude` or `codex` pointed at
# the Moonshot provider via a base-URL override, so it inherits the
# claude/codex pins above.
