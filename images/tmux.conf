# CapsCode keeper tmux configuration.
#
# Root-owned, shipped in the image, and the ONLY config the keeper's tmux server
# reads (`tmux -f /etc/capscode/tmux.conf -D`). The agent's $HOME is never
# consulted, so an agent-authored ~/.tmux.conf cannot execute when the operator
# attaches.

# The keeper starts a login shell as the pane command. Tool shims return to that
# shell when a tool exits, keeping the pane interactive.
set -g remain-on-exit off

# Scrollback for a multi-day box. tmux has no true "unlimited" — the buffer is
# RAM inside the container — so this is set high enough that a long agent session
# is not truncated. ~100k lines is roughly 20-40 MB per pane; it counts against
# the container's memory, not a tmpfs.
set -g history-limit 100000

# Headless, single-purpose box: no status bar, no window renaming from the
# tool's escape sequences.
set -g status off

# Mouse on: the scroll wheel enters copy-mode, so you can scroll back through the
# agent's output instead of the terminal swallowing it. Trade-off worth knowing —
# with mouse on, tmux owns selection, so hold Shift (Option on some terminals) to
# select text with your terminal's own copy instead.
set -g mouse on
# Scrolling out of the bottom of the history exits copy-mode, so the wheel does
# not leave you stranded in a scrolled state.
bind -T copy-mode-vi WheelDownPane send -X -N1 scroll-down
set -g @scroll-speed 3
set -g allow-rename off
set -g set-titles off

# Pass through 256-colour and true-colour so the tools' TUIs render as they do
# on the host.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Pass modified keys (Shift-Enter, Ctrl-Enter, ...) through to the tool instead
# of flattening them to their unmodified form. Without this tmux collapses
# Shift-Enter to a plain CR, so the AI tool submits the prompt where the user
# meant to insert a newline.
#
# `extended-keys on` (not `always`) because bookworm ships tmux 3.3a and
# `always` needs 3.4 — an unknown value makes the server refuse the whole
# config, which would take the keeper down with it. `on` forwards extended keys
# only while the tool has asked for them, which is what the tools do.
#
# The `terminal-features` entry advertises the OUTER terminal, matched on the
# attaching client's $TERM. capscode does not forward TERM into the capsule, so
# that is docker's default `xterm`; `xterm*` also covers `xterm-kitty` and the
# rest if TERM forwarding lands later. It is what makes tmux enable the
# protocol on the user's real terminal — a terminal that does not support it
# simply ignores the request.
set -s extended-keys on
set -as terminal-features "xterm*:extkeys"

# Do not let a detached client's size clamp the session.
set -g aggressive-resize on
